{% extends "base.html" %}
{% block title %}變更密碼{% endblock %}
{% block content %}
<div style="max-width:440px;margin:2rem auto">
  <h1>變更密碼</h1>
  {% if user.must_change_password %}
    <div class="alert info">首次登入或密碼經重設，請先變更密碼後才能使用系統。</div>
  {% endif %}
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/change-password" class="card">
    <div class="field">
      <label for="current">目前密碼</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">新密碼（至少 {{ min_len }} 個字元）</label>
      <input type="password" id="new_password" name="new_password"
             autocomplete="new-password" minlength="{{ min_len }}" required>
    </div>
    <div class="field">
      <label for="confirm">再次輸入新密碼</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password"
             minlength="{{ min_len }}" required>
    </div>
    <button type="submit" style="width:100%">確認變更</button>
  </form>
</div>
{% endblock %}
